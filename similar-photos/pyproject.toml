[project]
name = "similar-photos"
version = "0.1.0"
description = "Gera 3 imagens parecidas e busca origem/fóruns da foto (Linux CLI + GUI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0.0",
  "requests>=2.31.0",
]

[project.scripts]
similar-photos = "similar_photos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["similar_photos*"]
